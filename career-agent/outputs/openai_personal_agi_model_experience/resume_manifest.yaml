target_role: Research Engineer / Research Scientist, Personal AGI - Model Experience at OpenAI
sections:
  experience:
    - organization: Apple
      role: ML Data Scientist
      date_range: 2020-07 to present
      bullets:
        - text: Translated human-factors research into evaluation protocols and metrics for per-turn intent misalignment and false updates to an agent's inferred user state, estimating behavioral occurrence rates at scale.
          claim_ids: [claim_agent_human_factors, claim_agent_metrics]
          evidence_ids: [agent_action_human_factors, agent_action_metrics]
        - text: Built simulated-user and agent-as-judge workflows for long multimodal interactions, with targeted scenarios for visual-memory and sycophancy weaknesses; systematic failures changed subsequent development direction.
          claim_ids: [claim_agent_user_simulation, claim_agent_judge, claim_agent_scenario_generation, claim_agent_development_direction]
          evidence_ids: [agent_action_simulation, agent_action_judge, agent_action_scenario_generation, agent_outcome_development_direction]
        - text: Developed a reference-based, multi-stage LLM evaluator and expert/non-expert human-validation workflow used internally for performance reporting and failure discovery; reached 90% expert alignment on a 40-example gold set.
          claim_ids: [claim_health_auditable_judge, claim_health_expert_aligned_eval, claim_health_internal_production_evaluator, claim_health_90_alignment]
          evidence_ids: [health_action_goldset, health_action_labeling, health_action_judge, health_outcome_internal_production_use, health_outcome_alignment]
        - text: Scaled LLM- and agent-as-judge evaluation on an existing internal batch platform, debugging throughput and rate limits, versioning evaluators, and surfacing results through dashboards.
          claim_ids: [claim_eval_production_scale, claim_health_evaluator_versioning]
          evidence_ids: [agent_action_production_scale, health_action_evaluator_versioning]
        - text: Evaluated factual consistency and tool-call behavior, and built an internal chat prototype using VLM-as-judge retrieval and Voxel51/FiftyOne image collages for natural-language investigation of vision-model failures.
          claim_ids: [claim_eval_factual_consistency_tool_calls, claim_vision_llm_failure_analysis_prototype]
          evidence_ids: [agent_action_factual_consistency_tool_calls, vision_action_llm_failure_analysis_prototype]
        - text: Personally fine-tuned vision models on VLM-discovered and relighting-derived failure slices, comparing targeted model repair with alternative slice-discovery approaches.
          claim_ids: [claim_vision_model_repair]
          evidence_ids: [vision_action_model_repair]
    - organization: Ambarella
      role: Algorithm and Architecture Intern - Deep Learning Compression
      date_range: 2019-06 to 2019-08
      bullets:
        - text: Developed a saliency-based neural-network quantization heuristic that reduced an exponential search formulation to a linear-time method, and proposed a mixed-precision algorithm integrated into company software.
          claim_ids: [claim_ambarella_saliency, claim_ambarella_mixed_precision]
          evidence_ids: [ambarella_action_saliency, ambarella_action_mixed_precision]
