- id: claim_agent_judge
  statement: Built an agent-as-judge workflow for auditing long multimodal conversation
    transcripts.
  supported_by:
  - agent_action_judge
  confidence: verified
  role_families:
  - agent_evaluation
  - llm_evaluation
  risk: low
- id: claim_agent_human_factors
  statement: Translated human-factors insights into user-centered KPIs and human-evaluation
    protocols.
  supported_by:
  - agent_action_human_factors
  confidence: verified
  role_families:
  - human_ai_interaction
  - agent_evaluation
  risk: low
- id: claim_agent_metrics
  statement: Designed and explored metrics for per-turn user-intent misalignment and
    false updates to the agent's inferred internal state of the user, estimating their
    occurrence rates at scale.
  supported_by:
  - agent_action_metrics
  confidence: verified
  role_families:
  - agent_evaluation
  - human_ai_interaction
  risk: medium
  forbidden_inferences:
  - finalized production KPI ownership
- id: claim_eval_production_scale
  statement: Deployed and scaled LLM-as-judge and agent-as-judge evaluation on internal
    batch infrastructure, debugging throughput/rate-limit issues and surfacing results
    into dashboards.
  supported_by:
  - agent_action_production_scale
  confidence: verified
  role_families:
  - llm_evaluation
  - ml_engineering
  - ai_quality
  risk: medium
  required_qualifiers:
  - operated and scaled on an existing internal platform (Bolt); did not build the
    platform
  forbidden_inferences:
  - built a distributed-systems eval platform from scratch
- id: claim_agent_scenario_generation
  statement: Built evaluators and targeted scenario generators to probe agent weaknesses
    such as visual memory and sycophancy.
  supported_by:
  - agent_action_scenario_generation
  confidence: verified
  role_families:
  - agent_evaluation
  - ai_quality
  - llm_evaluation
  risk: medium
  required_qualifiers:
