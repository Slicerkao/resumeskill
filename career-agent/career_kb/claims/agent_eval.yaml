schema_version: 1
experience_id: exp_apple_multimodal_agent_eval
claims:
- id: claim_agent_user_simulation
  statement: Built a simulated-user agent to stress-test an open-ended multimodal
    conversational agent and expose scenario-specific failures.
  supported_by:
  - agent_action_simulation
  confidence: verified
  role_families:
  - agent_evaluation
  - applied_scientist
  - ai_quality
  risk: medium
  required_qualifiers:
  - project is ongoing
  forbidden_inferences:
