summary: Failure discovery, model repair, and fairness analysis for production vision systems including Vision Pro hand tracking.
actions:
  - id: vision_action_failure_discovery
    statement: Developed embedding-driven failure discovery using similarity search, clustering, out-of-distribution analysis, and per-position failure analysis.
    ownership: personal_contribution
    confidence: verified
  - id: vision_action_fairness
    statement: Designed Bayesian per-subject fairness analysis using Beta posteriors to estimate true success rates and the risk of demographic gaps exceeding a 10% product threshold.
    ownership: personal_contribution
    confidence: verified
  - id: vision_action_model_repair
    statement: Personally trained and fine-tuned vision models on VLM-discovered or relighting-derived slices and compared targeted repair against alternative slice-discovery approaches.
    ownership: personal_contribution
    confidence: verified
outcomes:
  - id: vision_outcome_quality
    statement: Work informed Vision Pro hand-tracking quality improvements associated with missed detections below 2% and false positives below 5 per hour.
    confidence: imported_resume
    caveats:
