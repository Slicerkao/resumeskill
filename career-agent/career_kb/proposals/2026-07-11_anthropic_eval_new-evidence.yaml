# ======================================================================
# NEW EVIDENCE -- exp_apple_vision_failure_discovery (2020-2023 work)
# ======================================================================
new_evidence_vision:
  target_file: career_kb/experiences/apple_vision_failure_discovery.yaml

  - id: vision_action_visualization
    statement: >
      Built performance-trend, error-cluster, and multimodal-data visualizations
      in Tableau and Voxel51 (FiftyOne) -- linking embedding-derived error clusters
      to image collages -- that helped the team see systematic issues such as
      hand-gesture failure patterns.
    ownership: personal_contribution
    confidence: verified

  - id: vision_action_model_health_reporting
    statement: >
      For each ML model release, produced leadership-facing reports translating
      user-experience proxy metrics and regression/improvement deep-dive failure
      analysis into decision-ready findings -- attributing regressions to specific
      ML-system components, using embedding clustering on unstructured image data
      correlated with failures, estimating per-pattern failure rates, and running
      online validation that confirmed offline-mined patterns matched on-device
      aggressor cases.
    ownership: personal_contribution
    confidence: verified
    caveats:
      - Release reports were a team deliverable to leadership; the deep-dive
        failure analysis, visualization, and pattern mining were the user's
        contribution.

  - id: vision_action_gesture_segmentation
    statement: >
      Showed that hand-gesture model gains and regressions were masked in
      aggregate metrics but concentrated in specific gesture types; surfacing
      these directed on-device QA to the right test areas and expected magnitude
      of user-perceived change.
    ownership: personal_contribution
    confidence: verified

# ======================================================================
# NEW EVIDENCE -- exp_apple_multimodal_agent_eval (current LLM-eval work)
# ======================================================================
new_evidence_agent:
  target_file: career_kb/experiences/apple_agent_eval.yaml

  - id: agent_action_production_scale
    statement: >
      Deployed and scaled LLM-as-judge and agent-as-judge evaluation on Apple's
      internal batch execution platform (Bolt), debugging throughput/rate-limit
      issues, and surfaced evaluator outputs into dashboards for stakeholders.
    ownership: personal_contribution
    confidence: verified
    caveats:
      - Operated and scaled evaluation on an existing internal platform; did not
        build the platform itself.
      - Spans the health-AI (LLM-as-judge) and agent-evaluation (agent-as-judge)
        projects.

